auth_enabled: false

server:
  http_listen_port: 9701
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /appdata/fastapi/loki
  storage:
    filesystem:
      chunks_directory: /appdata/fastapi/loki/chunks
      rules_directory: /appdata/fastapi/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2026-03-25
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 10000
  retention_period: 30d
  max_entries_limit_per_query: 10000
  per_stream_rate_limit: 10MB
  per_stream_rate_limit_burst: 20MB
  max_line_size_truncate: true

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false