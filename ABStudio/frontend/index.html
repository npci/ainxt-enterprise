<!doctype html>
<!-- Standalone-only height via inline style ATTRIBUTES (not a <style> block —
     Vite's CSS prefixer rewrites <style> blocks, but never style attributes).
     When embedded as a route, the host owns html/body/#root and Build Studio
     simply fills its container. -->
<html lang="en" style="height: 100%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lgfrontend</title>
  </head>
  <body style="height: 100%; margin: 0">
    <div id="root" style="height: 100%"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
