# Serves the built AiNxt UI and proxies API calls to the gateway.
#
# vite.config.js sets `base: '/portal/'` for production builds, so the bundle
# expects to live under /portal/. Only `^/ainxt/v1/api` is proxied, matching the
# dev-server proxy, and buffering is disabled there so SSE tokens stream instead
# of arriving in one block at the end.

server {
    listen       5173;
    server_name  _;
    root         /usr/share/nginx/html;

    client_max_body_size 100m;

    # nginx resolves a plain `proxy_pass http://gateway:8000` hostname ONCE,
    # when the worker starts, and caches that IP for the worker's entire
    # lifetime — it ignores Docker's DNS TTL. If the gateway container is ever
    # recreated afterwards (kb-setup.sh does exactly this: `docker compose up
    # -d gateway` to pick up new EMBED_SVC_URL/PARSE_SVC_URL after Knowledge
    # Base setup), it gets a new container IP, and this container keeps
    # proxying to the old, now-dead one — every request 502s until ai-ui
    # itself is restarted, which the frontend shows as "Cannot connect to
    # server. Is the backend running?" even though it plainly is. Routing
    # proxy_pass through a variable forces nginx to actually consult the
    # `resolver` below per request (subject to its `valid` TTL) instead of
    # resolving once and caching forever. 127.0.0.11 is Docker's embedded DNS.
    resolver 127.0.0.11 valid=10s;

    # Bare / is not part of the production bundle — send people to the app.
    location = / {
        return 302 /portal/;
    }

    # API -> gateway. No buffering: the chat endpoints stream via SSE.
    location /ainxt/v1/api {
        set $gateway_upstream   http://gateway:8000;
        proxy_pass              $gateway_upstream;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection        "";
        # Match the dev proxy, which strips compression for the same reason.
        proxy_set_header        Accept-Encoding   "identity";
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    # Convenience: health and API docs reachable on the UI origin too.
    # /health only exists under /ainxt/v1/api (see gateway.py's `_v1` router
    # mount) — route the target URI, not the raw /health request path.
    location = /health      { set $gateway_upstream http://gateway:8000/ainxt/v1/api/health; proxy_pass $gateway_upstream; }
    location /docs          { set $gateway_upstream http://gateway:8000; proxy_pass $gateway_upstream; }
    location /openapi.json  { set $gateway_upstream http://gateway:8000; proxy_pass $gateway_upstream; }

    # Hashed assets are immutable.
    location /portal/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router owns every other /portal/* path.
    location /portal/ {
        try_files $uri $uri/ /portal/index.html;
    }
}
